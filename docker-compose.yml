services:
  notiharbor:
    image: ${NOTIHARBOR_IMAGE:-notiharbor:local}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    env_file:
      - .env
    environment:
      PORT: "3000"
      SQLITE_PATH: /data/message-pusher.db
      TZ: ${TZ:-UTC}
    ports:
      - "127.0.0.1:${HOST_PORT:-3000}:3000"
    volumes:
      - "${DATA_DIR:-./data}:/data"
    networks:
      - services

networks:
  services:
    external: true
    name: ${DOCKER_NETWORK:?Set DOCKER_NETWORK to an existing Docker network}
